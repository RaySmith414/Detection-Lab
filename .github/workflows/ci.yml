name: CI

on:
  push:
  workflow_dispatch:

# Read-only: no job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      DETLAB_REQUIRE_SURICATA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Suricata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq suricata
          suricata -V
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Shell scripts
        run: shellcheck stack/*.sh
      - name: Every rule against every sample
        run: python -m detlab test
      - name: Generated files and ATT&CK tags
        run: python -m detlab check
      - name: Test suite
        run: python -m pytest -q

  stack:
    name: Run the rules in Elasticsearch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --quiet -r requirements.txt
      - name: Kernel setting for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Generate passwords
        run: stack/init.sh
      - name: Docker versions and compose file check
        working-directory: stack
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          docker compose config --quiet
      - name: Pull images
        working-directory: stack
        run: docker compose --profile replay pull --quiet
      - name: Start Elasticsearch and Kibana
        working-directory: stack
        run: docker compose up -d --wait --wait-timeout 600
      - name: Replay the captures in the Suricata container
        run: |
          stack/replay-pcaps.sh
          python -m detlab replay-check stack/output/network-alerts.ndjson
      - name: Load the samples
        run: |
          python -m detlab siem load | tee load.txt
          grep -q '^detlab-events: [1-9]' load.txt
          grep -q '^detlab-scenario-events: [1-9]' load.txt
          grep -q '^detlab-network-alerts: [1-9]' load.txt
      - name: Run every rule as EQL and compare the hits
        run: python -m detlab siem detect
      - name: The solution queries of the exercises find events
        run: python -m detlab siem exercises
      - name: Play the attack scenarios through Logstash
        run: |
          SIMULATOR_SEED=7 SIMULATOR_FAST=1 SIMULATOR_START_TIME=2026-11-10T10:00:00 LOG_DIR=stack/logs \
            python attack-simulator/simulator.py all
          python -m detlab siem hunt --wait 185 --expect-scenarios
      - name: Background telemetry from the log generator through Logstash
        run: |
          LOG_DIR=stack/logs LOG_GENERATOR_SEED=3 LOG_GENERATOR_ROUNDS=200 python log-generator/generator.py > /dev/null
          python -m detlab siem hunt --wait "$(stack/count-log-lines.sh)" --expect-auth-log stack/logs/linux/auth.log
      - name: The generators as containers
        run: |
          (cd stack && docker compose --profile live build --quiet)
          (cd stack && docker compose --profile live run --rm -e SIMULATOR_FAST=1 attack-simulator python simulator.py persistence)
          (cd stack && docker compose --profile live up -d log-generator && sleep 20 && docker compose --profile live stop log-generator)
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(cd stack && docker compose --profile live ps -aq log-generator)")" = 0
          python -m detlab siem hunt --wait "$(stack/count-log-lines.sh)" --expect-auth-log stack/logs/linux/auth.log
      - name: Create the Kibana data views and import the dashboard
        run: python -m detlab siem kibana
      - name: The indices hold what was loaded
        run: |
          set -a; . stack/.env; set +a
          for index in detlab-events detlab-scenario-events detlab-alerts detlab-network-alerts detlab-live-events detlab-live-alerts; do
            count="$(curl -fsS -u "elastic:${ELASTIC_PASSWORD}" "http://127.0.0.1:9200/${index}/_count" | python -c 'import json,sys; print(json.load(sys.stdin)["count"])')"
            echo "${index}: ${count}"
            test "${count}" -gt 0
          done
          curl -fsS -u "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:5601/api/data_views \
            | python -c 'import json,sys; names=sorted(v["title"] for v in json.load(sys.stdin)["data_view"]); print(names); assert names == ["detlab-alerts", "detlab-events", "detlab-live-alerts", "detlab-live-events", "detlab-network-alerts", "detlab-scenario-events"]'
          curl -fsS -u "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:5601/api/saved_objects/dashboard/detection-lab-dashboard \
            | python -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["title"])'
      - name: Resource use
        if: always()
        run: |
          free -m
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}'
      - name: Diagnostics
        if: failure()
        working-directory: stack
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 80
      - name: Stop the stack
        if: always()
        working-directory: stack
        run: docker compose --profile live down -v
      - name: Nothing is left behind
        run: |
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}'
          test -z "$(docker ps -aq)"
          test -z "$(docker network ls -q --filter name=detection-lab)"
          test -z "$(docker volume ls -q --filter name=detection-lab)"
