title: Rclone Copying Data
id: 9b52a179-bf36-48f5-bc46-39702df48bd6
status: test
description: Detects rclone copying, syncing or moving data, a tool often used to send stolen files to cloud storage.
references:
    - https://attack.mitre.org/techniques/T1567/002/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.exfiltration
    - attack.t1567.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\rclone.exe'
        - OriginalFileName: 'rclone.exe'
    selection_verb:
        CommandLine|contains:
            - ' copy '
            - ' sync '
            - ' move '
    condition: all of selection_*
falsepositives:
    - Backup jobs that use rclone
level: medium
