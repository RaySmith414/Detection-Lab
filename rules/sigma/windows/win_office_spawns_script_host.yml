title: Office Application Started a Script Host or Shell
id: 27adea6d-7170-4677-a160-8d71eb9061a8
status: test
description: Detects a Microsoft Office application starting a command interpreter or script host, the usual result of a malicious document.
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.initial-access
    - attack.t1566.001
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\mspub.exe'
            - '\msaccess.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
    condition: all of selection_*
falsepositives:
    - Office add-ins and macros approved by the organization
level: high
