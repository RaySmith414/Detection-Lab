title: Regsvr32 Scriptlet Execution
id: 43fdb8e6-1895-44a1-a45c-17d5b12aa49b
status: test
description: Detects regsvr32.exe loading scrobj.dll with a scriptlet, the technique known as Squiblydoo.
references:
    - https://attack.mitre.org/techniques/T1218/010/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.stealth
    - attack.t1218.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\regsvr32.exe'
    selection_scrobj:
        CommandLine|contains: 'scrobj.dll'
    selection_scriptlet:
        CommandLine|contains:
            - '/i:'
            - '-i:'
    condition: all of selection_*
falsepositives:
    - Rare. Some old installers register scriptlets this way
level: high
