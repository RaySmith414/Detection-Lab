title: Remote Process Creation With WMIC
id: ad89e62f-ecc1-40e6-9ac4-4a20bc0f61d4
status: test
description: Detects wmic.exe starting a process on another host.
references:
    - https://attack.mitre.org/techniques/T1047/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\wmic.exe'
    selection_cmd:
        CommandLine|contains|all:
            - '/node:'
            - 'process'
            - 'call'
            - 'create'
    condition: all of selection_*
falsepositives:
    - Legacy administration scripts
level: high
