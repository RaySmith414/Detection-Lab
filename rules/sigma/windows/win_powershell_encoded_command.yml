title: PowerShell Started With an Encoded Command
id: 0a6f2b1c-5d3e-4f7a-9b8c-1d2e3f4a5b6c
status: test
description: Detects PowerShell started with a Base64 encoded command, a common way to hide what a script does.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.execution
    - attack.t1059.001
    - attack.stealth
    - attack.t1027.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
    selection_encoded:
        CommandLine|contains:
            - ' -enc '
            - ' -enco'
            - ' -ec '
            - ' -EncodedCommand '
    filter_main_sccm:
        ParentImage|endswith: '\CCM\CcmExec.exe'
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Management software that passes scripts as encoded commands
level: medium
