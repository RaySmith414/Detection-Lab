title: PsExec Service Running or Starting a Process
id: 4ef84875-1887-4641-848b-2a1238b59494
status: test
description: Detects PSEXESVC.exe starting and any process whose parent is PSEXESVC.exe. Both mean PsExec was used against this host.
references:
    - https://attack.mitre.org/techniques/T1569/002/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.execution
    - attack.t1569.002
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_service:
        Image|endswith: '\PSEXESVC.exe'
    selection_child:
        ParentImage|endswith: '\PSEXESVC.exe'
    condition: 1 of selection_*
falsepositives:
    - Administrators who use PsExec for remote support
level: medium
