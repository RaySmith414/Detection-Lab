title: Registry Hives With Credentials Saved to Disk
id: 7cfee3f8-0061-42bb-88dd-467e85b92271
status: test
description: Detects reg.exe saving or exporting the SAM, SYSTEM or SECURITY hive.
references:
    - https://attack.mitre.org/techniques/T1003/002/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.credential-access
    - attack.t1003.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\reg.exe'
    selection_verb:
        CommandLine|contains:
            - ' save '
            - ' export '
    selection_hive:
        CommandLine|contains:
            - 'hklm\sam'
            - 'hklm\system'
            - 'hklm\security'
            - 'HKEY_LOCAL_MACHINE\SAM'
            - 'HKEY_LOCAL_MACHINE\SYSTEM'
            - 'HKEY_LOCAL_MACHINE\SECURITY'
    condition: all of selection_*
falsepositives:
    - Backup scripts that export the SYSTEM hive
level: high
