title: Certutil Used to Decode a File
id: 8a4c1260-aef7-4360-aeae-3c17b62c91a8
status: test
description: Detects certutil.exe decoding Base64 or hex content, often the step after a text payload is dropped.
references:
    - https://attack.mitre.org/techniques/T1140/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.stealth
    - attack.t1140
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\certutil.exe'
        - OriginalFileName: 'CertUtil.exe'
    selection_decode:
        CommandLine|contains:
            - '-decode '
            - '/decode '
            - '-decodehex '
            - '/decodehex '
    condition: all of selection_*
falsepositives:
    - Administrators converting certificate files
level: medium
