title: Microsoft Defender Protection Changed From PowerShell
id: 9b7037d5-bf17-4c4e-9d13-04c5628bc593
status: test
description: Detects PowerShell turning off Microsoft Defender protections or adding exclusions.
references:
    - https://attack.mitre.org/techniques/T1685/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmdlet:
        CommandLine|contains:
            - 'Set-MpPreference'
            - 'Add-MpPreference'
    selection_setting:
        CommandLine|contains:
            - 'DisableRealtimeMonitoring'
            - 'DisableBehaviorMonitoring'
            - 'DisableIOAVProtection'
            - 'DisableScriptScanning'
            - 'ExclusionPath'
            - 'ExclusionProcess'
            - 'ExclusionExtension'
    condition: all of selection_*
falsepositives:
    - Endpoint management that sets exclusions for approved software
level: high
