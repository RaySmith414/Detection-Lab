title: Password Protected Archive Created With 7-Zip or WinRAR
id: f5dd1d0e-abd1-4143-905b-608f0e8aefc9
status: test
description: Detects 7-Zip or WinRAR creating an archive with a password on the command line.
references:
    - https://attack.mitre.org/techniques/T1560/001/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.collection
    - attack.t1560.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_7zip:
        Image|endswith:
            - '\7z.exe'
            - '\7za.exe'
            - '\7zr.exe'
        CommandLine|contains|all:
            - ' a '
            - ' -p'
    selection_rar:
        Image|endswith:
            - '\rar.exe'
            - '\winrar.exe'
        CommandLine|contains|all:
            - ' a '
            - ' -hp'
    condition: 1 of selection_*
falsepositives:
    - Backup jobs that encrypt their archives
level: medium
