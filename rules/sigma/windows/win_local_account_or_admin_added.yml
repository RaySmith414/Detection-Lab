title: Local Account Created or Added to Administrators
id: 4be6a3bb-94a2-447e-a362-bcc7fe72b063
status: test
description: Detects net.exe creating a local account or adding an account to the local Administrators group.
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.privilege-escalation
    - attack.t1098
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_cmd_user:
        CommandLine|contains|all:
            - ' user '
            - '/add'
    selection_cmd_group:
        CommandLine|contains|all:
            - 'localgroup'
            - 'administrators'
            - '/add'
    condition: selection_img and 1 of selection_cmd_*
falsepositives:
    - Help desk staff creating local accounts by hand
level: medium
