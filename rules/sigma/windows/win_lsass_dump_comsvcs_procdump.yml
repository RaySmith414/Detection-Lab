title: LSASS Memory Dump With Comsvcs or ProcDump
id: 42917b2b-15a6-4bda-8d82-f09749920fcf
status: test
description: Detects the two most common ways to dump LSASS memory from the command line, the comsvcs.dll MiniDump export and ProcDump.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_comsvcs:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    selection_procdump:
        Image|endswith:
            - '\procdump.exe'
            - '\procdump64.exe'
        CommandLine|contains: 'lsass'
    condition: 1 of selection_*
falsepositives:
    - Support staff collecting a dump at the request of the vendor
level: critical
