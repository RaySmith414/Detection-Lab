title: Domain Trust Discovery With Nltest
id: 7553634a-e987-4a59-81ad-0597b2300d43
status: test
description: Detects nltest.exe listing domain trusts or domain controllers.
references:
    - https://attack.mitre.org/techniques/T1482/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.discovery
    - attack.t1482
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\nltest.exe'
    selection_cmd:
        CommandLine|contains:
            - '/domain_trusts'
            - '/all_trusts'
            - '/dclist:'
    condition: all of selection_*
falsepositives:
    - Domain administrators troubleshooting trusts
level: medium
