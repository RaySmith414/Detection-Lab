title: PsExec Service Installed
id: 80caf68c-e526-4e35-a234-c1ccf0f697bd
status: test
description: Detects event 7045 for the service that PsExec installs on its target.
references:
    - https://attack.mitre.org/techniques/T1569/002/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.execution
    - attack.t1569.002
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    service: system
    product: windows
detection:
    selection_event:
        EventID: '7045'
    selection_service:
        - ServiceName: 'PSEXESVC'
        - ImagePath|endswith: '\PSEXESVC.exe'
    condition: all of selection_*
falsepositives:
    - Administrators who use PsExec for remote maintenance
level: medium
