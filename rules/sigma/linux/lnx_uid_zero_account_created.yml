title: Account Created or Changed to UID 0
id: 6438817b-5aba-4fb7-9846-80029b570dc3
status: test
description: Detects useradd or usermod giving an account the user ID of root.
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.privilege-escalation
    - attack.t1098
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith:
            - '/useradd'
            - '/adduser'
            - '/usermod'
    selection_uid:
        CommandLine|contains:
            - ' -u 0 '
            - ' -ou 0 '
            - ' --uid 0 '
            - ' --uid=0 '
    condition: all of selection_*
falsepositives:
    - Unlikely
level: critical
