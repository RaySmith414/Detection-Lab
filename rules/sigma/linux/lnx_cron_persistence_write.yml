title: Cron Table Written From the Command Line
id: 1d0fa417-297d-4eec-9239-6cdc21fb4b16
status: test
description: Detects a command that appends to or overwrites a system cron file.
references:
    - https://attack.mitre.org/techniques/T1053/003/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_file:
        CommandLine|contains:
            - '/etc/crontab'
            - '/etc/cron.d/'
            - '/var/spool/cron'
    selection_write:
        CommandLine|contains:
            - '>>'
            - '> /'
            - 'tee '
    condition: all of selection_*
falsepositives:
    - Configuration management that writes cron files through a shell
level: medium
