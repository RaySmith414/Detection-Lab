title: Password Hash File Read With a Text Tool
id: 7438bbbb-34c2-4127-a9d1-1484db00913b
status: test
description: Detects /etc/shadow read or copied with a general purpose tool.
references:
    - https://attack.mitre.org/techniques/T1003/008/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.credential-access
    - attack.t1003.008
logsource:
    category: process_creation
    product: linux
detection:
    selection_file:
        CommandLine|contains: '/etc/shadow'
    selection_tool:
        Image|endswith:
            - '/cat'
            - '/less'
            - '/more'
            - '/head'
            - '/tail'
            - '/cp'
            - '/base64'
            - '/xxd'
            - '/strings'
    condition: all of selection_*
falsepositives:
    - Administrators checking an account by hand
level: medium
