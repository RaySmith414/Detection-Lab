title: Download Piped Straight Into a Shell
id: b9b7c430-bb3e-44d7-a83c-a9fa10d883cd
status: test
description: Detects curl or wget output piped into a shell.
references:
    - https://attack.mitre.org/techniques/T1105/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.execution
    - attack.t1059.004
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: linux
detection:
    selection_download:
        CommandLine|contains:
            - 'curl '
            - 'wget '
    selection_pipe:
        - CommandLine|endswith:
              - '| sh'
              - '|sh'
              - '| bash'
              - '|bash'
        - CommandLine|contains:
              - '| sh '
              - '|sh '
              - '| bash '
              - '|bash '
              - '| sudo sh'
              - '| sudo bash'
    condition: all of selection_*
falsepositives:
    - Install scripts that vendors publish as a one-line command
level: medium
