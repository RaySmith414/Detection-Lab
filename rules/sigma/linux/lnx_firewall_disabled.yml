title: Host Firewall Stopped or Flushed
id: 491da640-9ec4-4086-8cea-45d44589d82d
status: test
description: Detects commands that turn off the host firewall or remove all of its rules.
references:
    - https://attack.mitre.org/techniques/T1686/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.defense-impairment
    - attack.t1686
logsource:
    category: process_creation
    product: linux
detection:
    selection_ufw:
        Image|endswith: '/ufw'
        CommandLine|contains: 'disable'
    selection_iptables:
        Image|endswith:
            - '/iptables'
            - '/ip6tables'
        CommandLine|contains:
            - ' -F'
            - ' --flush'
    selection_systemctl:
        Image|endswith: '/systemctl'
        CommandLine|contains:
            - 'stop'
            - 'disable'
            - 'mask'
    selection_systemctl_unit:
        CommandLine|contains:
            - 'firewalld'
            - 'ufw'
            - 'nftables'
    condition: selection_ufw or selection_iptables or (selection_systemctl and selection_systemctl_unit)
falsepositives:
    - Maintenance windows and firewall rule reloads
level: high
