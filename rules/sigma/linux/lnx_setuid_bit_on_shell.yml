title: Setuid Bit Placed on a Shell or a File in a Temporary Folder
id: 592a156a-3557-48d7-8031-8f6ff313d5e1
status: test
description: Detects chmod setting the setuid bit on a shell or on a file in a folder that every user can write to.
references:
    - https://attack.mitre.org/techniques/T1548/001/
author: Rayshaun Smith
date: 2026-11-18
tags:
    - attack.privilege-escalation
    - attack.t1548.001
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith: '/chmod'
    selection_mode:
        CommandLine|contains:
            - 'u+s'
            - ' +s '
            - ' 4755 '
            - ' 4777 '
            - ' 6755 '
    selection_target:
        CommandLine|contains:
            - '/bin/bash'
            - '/bin/sh'
            - '/bin/dash'
            - '/bin/zsh'
            - '/tmp/'
            - '/dev/shm/'
            - '/var/tmp/'
    condition: all of selection_*
falsepositives:
    - Unlikely
level: high
