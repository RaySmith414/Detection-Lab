[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is how pytest works
    "S603",  # the Suricata call uses a fixed argument list
    "S607",  # suricata is found on PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"detlab/samples.py" = ["S108"]  # sample command lines mention /tmp on purpose
"detlab/logstash.py" = ["E501"]  # the pipeline text holds long grok patterns
# The simulator and the log generator draw random values and hold long sample command lines.
"attack-simulator/*" = ["S311", "E501", "B007", "S108"]
"log-generator/*" = ["S311", "E501", "B007", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
